<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Espace Jeff</title>
<link rel="stylesheet" href="/style.css">
<script src="/qrcode.js"></script>
</head>
<body class="a">
<div id="login" class="wrap" hidden>
  <section class="card hero">
    <h1>Espace Jeff</h1>
    <form id="lf"><label>Code d'accès<input id="code" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lerr"></p><button class="btn big">Entrer</button></form>
  </section>
</div>

<div id="dash" hidden>
  <header class="abar">
    <div><span class="brand" id="ev"></span> <span class="pill" id="pill"></span></div>
    <nav>
      <button class="tab on" data-t="pilot">Pilotage</button>
      <button class="tab" data-t="people">Participants <span id="cnt" class="badge"></span></button>
      <button class="tab" data-t="tables">Tables</button>
      <button class="tab" data-t="settings">Réglages</button>
    </nav>
  </header>
  <div id="dirty" class="dirtybar" hidden>Des changements ne sont pas encore pris en compte (retardataire, absent…).
    <button class="btn sm" data-a="recompute">Mettre à jour les parcours</button></div>
  <main class="awrap">
    <section id="t-pilot" class="tabp"></section>
    <section id="t-people" class="tabp" hidden></section>
    <section id="t-tables" class="tabp" hidden></section>
    <section id="t-settings" class="tabp" hidden></section>
  </main>
</div>

<div id="toast" class="toast" hidden></div>

<script>
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let code = null, S = null, offset = 0, timerId = null, filter = '', beeped = null, tableRound = null;
try { code = localStorage.getItem('sm_admin'); } catch {}
const joinUrl = location.origin + '/';

async function api(body) {
  const r = await fetch('/api/admin', { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Admin-Code': code || '' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin('Code incorrect.'); throw new Error('auth'); }
  if (!r.ok) throw new Error(j.error || 'Erreur');
  return j;
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 3200); }
async function act(body, confirmMsg) {
  if (confirmMsg && !confirm(confirmMsg)) return;
  try { S = await api(body); render(); } catch (e) { if (e.message !== 'auth') toast(e.message); }
}
function showLogin(err) { $('#login').hidden = false; $('#dash').hidden = true; $('#lerr').textContent = err || ''; }
$('#lf').onsubmit = async e => { e.preventDefault(); code = $('#code').value.trim(); try { localStorage.setItem('sm_admin', code); } catch {} try { S = await api(); $('#login').hidden = true; $('#dash').hidden = false; render(); } catch {} };

$$('.tab').forEach(b => b.onclick = () => { $$('.tab').forEach(x => x.classList.toggle('on', x === b)); $$('.tabp').forEach(p => p.hidden = p.id !== 't-' + b.dataset.t); render(); });
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; const a = b.dataset.a; const msgs = {
  close: 'Clôturer les inscriptions et calculer les parcours ?', next: null, prev: 'Revenir au tour précédent ?', reset: 'Tout effacer (participants et parcours) ? Action définitive.', finish: 'Terminer l’événement ?', delete: 'Supprimer ce participant (doublon) ?' };
  act({ action: a, id: b.dataset.id }, msgs[a]); });

const fmt = ms => { ms = Math.max(0, ms); return Math.floor(ms / 60000) + ':' + String(Math.floor(ms / 1000) % 60).padStart(2, '0'); };
const active = () => S.participants.filter(p => p.active);

function renderPilot() {
  const el = $('#t-pilot'), n = active().length, st = S.stats;
  const tables = Math.max(1, Math.floor(n / 4)) ;
  if (S.status === 'open') {
    el.innerHTML = `<div class="split">
      <div class="qrbox"><div id="qr"></div><div class="url">${esc(joinUrl.replace(/^https?:\/\//, ''))}</div>
        <button class="btn ghost sm" id="fs">Plein écran (projection)</button></div>
      <div class="side">
        <div class="bigcount"><b>${n}</b><span>présence${n > 1 ? 's' : ''} confirmée${n > 1 ? 's' : ''}</span></div>
        <p class="muted">${n >= 2 ? `≈ ${tables} table${tables > 1 ? 's' : ''} de 4` : 'En attente des premiers participants…'}</p>
        <ol class="recent">${S.participants.slice(-6).reverse().map(p => `<li>${esc(p.name)}${p.company ? ` <span class="muted">· ${esc(p.company)}</span>` : ''}</li>`).join('')}</ol>
        <button class="btn big" data-a="close" ${n < 2 ? 'disabled' : ''}>Clôturer les inscriptions<br><small>et envoyer les parcours</small></button>
      </div></div>`;
    drawQR(); $('#fs').onclick = () => document.documentElement.requestFullscreen?.();
    return;
  }
  const stats = st ? `<div class="stats">
      <div><b>${st.participants}</b><span>participants</span></div>
      <div><b>${st.tables}</b><span>tables</span></div>
      <div><b>${st.minMeet === st.maxMeet ? st.minMeet : st.minMeet + '–' + st.maxMeet}</b><span>rencontres / personne</span></div>
      <div><b>${st.repeatedPairs}</b><span>rencontre${st.repeatedPairs > 1 ? 's' : ''} en doublon</span></div></div>` : '';
  const cr = S.currentRound, R = S.rounds;
  let core;
  if (S.status === 'done' || cr > R) core = `<div class="round"><div class="rl">Événement terminé</div><p class="muted">Merci à tous !</p><button class="btn ghost" data-a="prev">Revenir au dernier tour</button></div>`;
  else if (cr === 0) core = `<div class="round"><div class="rl">Parcours envoyés</div><p class="muted">Chacun voit sa table du tour 1 sur son téléphone.</p>
      <button class="btn huge" data-a="next">Lancer le tour 1</button></div>`;
  else core = `<div class="round"><div class="rl">Tour <b>${cr}</b> / ${R}</div><div class="clock" id="clock"></div>
      <button class="btn huge" data-a="next">${cr < R ? `Changement de table → tour ${cr + 1}` : 'Terminer l’événement'}</button>
      <div class="row"><button class="btn ghost sm" data-a="restartTimer">Relancer le chrono</button><button class="btn ghost sm" data-a="prev">← Tour précédent</button>
      <button class="btn ghost sm" data-a="reopen">${S.reopened ? 'Inscriptions rouvertes ✓' : 'Accepter un retardataire'}</button></div></div>`;
  const qrMini = (cr === 0 || S.reopened) ? `<div class="qrmini"><div id="qr"></div><small>${S.reopened || cr === 0 ? 'Retardataires : scannez, puis Jeff clique « Mettre à jour »' : ''}</small></div>` : '';
  el.innerHTML = core + stats + (cr === 0 ? `<div class="row c"><button class="btn ghost sm" data-a="reopen">Rouvrir les inscriptions</button></div>` : '') + qrMini;
  if (qrMini) drawQR(150);
  tick();
}
function drawQR(size) {
  const box = $('#qr'); if (!box) return;
  box.innerHTML = '';
  const s = size || Math.min(420, window.innerWidth - 80, window.innerHeight - 220);
  if (window.qrcode) {
    const q = qrcode(0, 'M'); q.addData(joinUrl); q.make();
    const cell = Math.max(2, Math.floor(s / (q.getModuleCount() + 8)));
    box.innerHTML = q.createSvgTag({ cellSize: cell, margin: cell * 4, scalable: true });
    const svg = box.querySelector('svg'); if (svg) { svg.setAttribute('width', s); svg.setAttribute('height', s); svg.querySelector('path')?.setAttribute('fill', '#14213d'); }
  } else box.innerHTML = `<p class="warn">QR indisponible. Adresse : ${esc(joinUrl)}</p>`;
}
function tick() {
  clearInterval(timerId);
  const c = $('#clock'); if (!c || !S.roundStartedAt) return;
  const up = () => {
    const left = S.roundStartedAt + S.minutes * 60000 - (Date.now() + offset);
    c.textContent = left > 0 ? fmt(left) : 'Temps écoulé !';
    c.classList.toggle('late', left <= 60000);
    if (left <= 0 && beeped !== S.roundStartedAt) { beeped = S.roundStartedAt; beep(); }
  };
  up(); timerId = setInterval(up, 500);
}
function beep() { try { const ac = new AudioContext(), o = ac.createOscillator(), g = ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value = 880; g.gain.setValueAtTime(.2, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + 1.2); o.start(); o.stop(ac.currentTime + 1.2); } catch {} }

function renderPeople() {
  const el = $('#t-people');
  const keep = document.activeElement && document.activeElement.id === 'q';
  const list = S.participants.filter(p => !filter || (p.name + ' ' + p.company).toLowerCase().includes(filter.toLowerCase()));
  el.innerHTML = `<div class="row"><input id="q" placeholder="Rechercher un nom…" value="${esc(filter)}"></div>
    <form id="addf" class="row add"><input name="name" placeholder="Ajouter quelqu'un (sans téléphone)" required><input name="company" placeholder="Entreprise"><button class="btn sm">Ajouter</button></form>
    <table class="ptable"><thead><tr><th>Nom</th><th>Parcours</th><th></th></tr></thead><tbody>
    ${list.map(p => `<tr class="${p.active ? '' : 'off'}"><td><b>${esc(p.name)}</b>${p.company ? `<br><span class="muted">${esc(p.company)}</span>` : ''}</td>
      <td class="mono">${p.plan ? p.plan.map((t, i) => `<span class="${S.currentRound === i + 1 ? 'curt' : ''}">${t ?? '–'}</span>`).join(' ') : '<span class="muted">—</span>'}</td>
      <td class="acts"><button class="btn ghost sm" data-a="toggle" data-id="${p.id}">${p.active ? 'Absent' : 'Présent'}</button>
      <button class="btn ghost sm danger" data-a="delete" data-id="${p.id}" title="Supprimer (doublon)">✕</button></td></tr>`).join('') || '<tr><td colspan="3" class="muted">Personne pour l’instant.</td></tr>'}
    </tbody></table>`;
  const q = $('#q'); q.oninput = () => { filter = q.value; renderPeople(); };
  if (keep) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  $('#addf').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target); act({ action: 'add', name: fd.get('name'), company: fd.get('company') }); };
}

function renderTables() {
  const el = $('#t-tables');
  if (S.status === 'open') { el.innerHTML = '<p class="muted">Les tables apparaîtront après la clôture des inscriptions.</p>'; return; }
  const R = S.rounds;
  if (tableRound == null) tableRound = Math.max(1, Math.min(R, S.currentRound || 1));
  const by = {};
  for (const p of active()) { const t = p.plan && p.plan[tableRound - 1]; if (t != null) (by[t] = by[t] || []).push(p); }
  const nums = Object.keys(by).map(Number).sort((a, b) => a - b);
  el.innerHTML = `<div class="row rounds">${Array.from({ length: R }, (_, i) => `<button class="chip ${tableRound === i + 1 ? 'on' : ''}" data-r="${i + 1}">Tour ${i + 1}${S.currentRound === i + 1 ? ' •' : ''}</button>`).join('')}</div>
    <div class="tgrid">${nums.map(t => `<div class="tcard"><div class="tn">Table ${t}</div>${by[t].map(p => `<div>${esc(p.name)}</div>`).join('')}</div>`).join('')}</div>`;
  $$('.chip').forEach(c => c.onclick = () => { tableRound = +c.dataset.r; renderTables(); });
}

function renderSettings() {
  const el = $('#t-settings'), locked = S.currentRound > 0;
  el.innerHTML = `<form id="sf" class="card set">
      <label>Nom de l'événement<input name="eventName" value="${esc(S.eventName)}"></label>
      <div class="row"><label>Nombre de tours<input name="rounds" type="number" min="1" max="12" value="${S.rounds}" ${locked ? 'disabled' : ''}></label>
      <label>Minutes par tour<input name="minutes" type="number" min="1" max="60" value="${S.minutes}" ${locked ? 'disabled' : ''}></label></div>
      <button class="btn" ${locked ? 'disabled' : ''}>Enregistrer</button>${locked ? '<p class="muted small">Réglages verrouillés pendant l’événement.</p>' : ''}
    </form>
    <div class="card set"><h3>Adresse à partager</h3><p class="mono">${esc(joinUrl)}</p>
      <h3>Tester avant le jour J</h3><p class="muted small">Ajoute des participants fictifs pour voir le calcul. Pensez à tout effacer ensuite.</p>
      <div class="row"><button class="btn ghost sm" data-demo="28">+28 fictifs</button><button class="btn ghost sm" data-demo="40">+40</button><button class="btn ghost sm" data-demo="52">+52</button><button class="btn ghost sm" data-demo="64">+64</button></div>
      <h3>Remise à zéro</h3><button class="btn danger" data-a="reset">Tout effacer</button></div>`;
  $('#sf').onsubmit = e => { e.preventDefault(); const fd = new FormData(e.target); act({ action: 'settings', eventName: fd.get('eventName'), rounds: +fd.get('rounds') || undefined, minutes: +fd.get('minutes') || undefined }); toast('Enregistré'); };
  $$('[data-demo]').forEach(b => b.onclick = () => act({ action: 'demo', n: +b.dataset.demo }));
}

let lastSig = '';
function render(force = true) {
  offset = S.now - Date.now();
  $('#ev').textContent = S.eventName;
  const labels = { open: 'Inscriptions ouvertes', closed: S.currentRound ? 'En cours' : 'Prêt', done: 'Terminé' };
  $('#pill').textContent = labels[S.status]; $('#pill').className = 'pill ' + S.status;
  $('#cnt').textContent = active().length;
  $('#dirty').hidden = !(S.dirty && S.status !== 'open');
  const tab = $('.tab.on').dataset.t;
  const sig = JSON.stringify(S) + tab;
  if (!force && sig === lastSig) return;
  if (!force && tab === 'settings') return;           // ne pas écraser une saisie
  if (!force && tab === 'people' && document.activeElement?.closest('#addf')) return;
  lastSig = sig;
  ({ pilot: renderPilot, people: renderPeople, tables: renderTables, settings: renderSettings })[tab]();
}
async function poll() { if (!code || $('#dash').hidden) return; try { S = await api(); render(false); } catch {} }

(async () => {
  if (!code) return showLogin();
  try { S = await api(); $('#dash').hidden = false; render(); } catch {}
})();
setInterval(poll, 3000);
window.addEventListener('resize', () => { if (S && S.status === 'open') drawQR(); });
</script>
</body>
</html>
